# GoReleaser OSS v2 configuration. Policy lives in ADR 0006; operational
# detail (versions, checklist, bootstrap) in docs/runbooks/release.md.
#
# ldflags use source metadata instead of the build clock so a retry from the
# same commit produces the same binaries.
version: 2

project_name: depatrol

builds:
  - env:
      - CGO_ENABLED=0
    # Without -trimpath the binary embeds the builder's absolute paths —
    # toolchain, module cache, and the source tree that panic traces cite.
    # It also completes reproducibility alongside mod_timestamp below.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

# The npm repackaging job (packaging/npm/prepare.mjs) parses these archive
# names — keep name_template in sync with PLATFORMS there.
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

# Keep the checksum filename stable for the npm repackaging contract.
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Publishing is owned by the release workflow after it verifies the shared
# bundle. A plain goreleaser release must fail closed instead of publishing.
release:
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
