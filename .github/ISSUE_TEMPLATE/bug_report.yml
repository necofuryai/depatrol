name: Bug report
description: Something in depatrol doesn't work as documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before submitting, please redact anything sensitive from command output:
        **GitHub tokens, private organization/repository names, and internal URLs**. depatrol output routinely contains repository names — check it before pasting.

        Security vulnerabilities must **not** be reported here — use the repository **Security** tab → *Report a vulnerability*.
  - type: input
    id: version
    attributes:
      label: depatrol version
      description: Output of `depatrol --version`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: Installation channel
      options:
        - npm / npx / bunx / pnpm dlx
        - go install
        - Binary archive from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64 / Windows 11 amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and the relevant output. Redact tokens and private repository names.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead, and why (link docs/README if the expectation comes from them).
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — bot configuration in the scanned repository (Dependabot/Renovate), token scopes, org size, etc.
    validations:
      required: false
