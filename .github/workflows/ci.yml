name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=rhysd/actionlint versioning=semver-coerced
          ACTIONLINT_VERSION: v1.7.12
        run: |
          version=${ACTIONLINT_VERSION#v}
          archive="actionlint_${version}_linux_amd64.tar.gz"
          tmp_dir=$(mktemp -d)
          gh release download "$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --dir "$tmp_dir"
          gh attestation verify "$tmp_dir/$archive" \
            --repo rhysd/actionlint \
            --source-ref "refs/tags/$ACTIONLINT_VERSION" \
            --deny-self-hosted-runners
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tmp_dir/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          rm -rf "$tmp_dir"
          printf '%s\n' "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=moderate
      - run: bash scripts/ci/verify.sh

  node-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node scripts/release/build-package.mjs --check-bundle dist/depatrol.js
      - run: node dist/depatrol.js --version
      - run: node --test scripts/release/*.test.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # renovate: datasource=npm depName=npm versioning=npm
      - run: npm install -g npm@11.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bash scripts/release/preflight.sh
