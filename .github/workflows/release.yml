# A signed stable tag is the only release trigger. The build job creates one
# attested single-package bundle; GitHub Release and npm consume that exact
# bundle without re-packing (ADR 0009).
name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/guard.sh "$GITHUB_REF_NAME"

  release-validation:
    needs: release-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # renovate: datasource=npm depName=npm versioning=npm
      - run: npm install -g npm@11.19.0
      - name: Install verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=rhysd/actionlint versioning=semver-coerced
          ACTIONLINT_VERSION: v1.7.12
        run: |
          version=${ACTIONLINT_VERSION#v}
          archive="actionlint_${version}_linux_amd64.tar.gz"
          tmp_dir=$(mktemp -d)
          gh release download "$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --dir "$tmp_dir"
          gh attestation verify "$tmp_dir/$archive" \
            --repo rhysd/actionlint \
            --source-ref "refs/tags/$ACTIONLINT_VERSION" \
            --deny-self-hosted-runners
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tmp_dir/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          rm -rf "$tmp_dir"
          printf '%s\n' "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=moderate
      - run: bash scripts/ci/verify.sh
      - run: bash scripts/release/preflight.sh

  release-build:
    needs: release-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # renovate: datasource=npm depName=npm versioning=npm
      - run: npm install -g npm@11.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build single npm tarball once
        run: |
          version=${GITHUB_REF_NAME#v}
          commit_date=$(git show -s --format=%cI "$GITHUB_SHA")
          node scripts/release/build-package.mjs \
            "$version" "$GITHUB_SHA" "$commit_date" dist-release
      - name: Generate release notes
        run: bash scripts/release/notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create verified release bundle
        run: >-
          node scripts/release/artifacts.mjs create
          dist-release release-bundle "$GITHUB_REF_NAME" "$GITHUB_SHA" release-notes.md
      - name: Attest release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-bundle/*
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: release-bundle/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  github-release:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: release-bundle
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/verify-attestations.sh release-bundle
      - name: Publish or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: bash scripts/release/publish-github.sh "$GITHUB_REF_NAME" release-bundle

  npm:
    needs:
      - release-build
      - github-release
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: release-bundle
      - name: Verify release bundle and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/artifacts.mjs verify \
            release-bundle "$GITHUB_REF_NAME" "$GITHUB_SHA"
          bash scripts/release/verify-attestations.sh release-bundle
      # renovate: datasource=npm depName=npm versioning=npm
      - run: npm install -g npm@11.19.0
      - name: Publish exact attested tarball
        run: node scripts/release/publish-npm.mjs release-bundle
